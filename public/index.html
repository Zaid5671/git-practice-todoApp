<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Practice Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>My Tasks</h1>
            <p>Practice Git branching, merging, and conflicts.</p>
        </header>

        <main>
            <div class="add-todo-container">
                <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
                <button id="add-btn">Add Task</button>
            </div>

            <ul id="todo-list" class="todo-list">
                <!-- Todos will be injected here via JS -->
            </ul>
        </main>

        <footer>
            <p>Git Practice To-Do App &copy; <span id="year"></span> | <a href="#">About</a></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
